version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint 8 currently supports TypeScript versions below 6.1.
      - dependency-name: typescript
        versions:
          - ">=7"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
